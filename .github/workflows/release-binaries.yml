name: release-binaries

# Asset names are a contract with scripts/install.sh, which resolves
# skipper-mcp-${tag}-${triple}.tar.gz with the tag keeping its leading "v".
# Changing one side alone breaks the curl-pipe-bash install.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One bad target must not hide the state of the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="skipper-mcp-${{ inputs.tag }}-${{ matrix.target }}"
          tar czf "${name}.tar.gz" -C "target/${{ matrix.target }}/release" skipper-mcp
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Verify the archive holds the binary at its root
        shell: bash
        run: |
          set -euo pipefail
          tar tzf "$ASSET" | grep -qx 'skipper-mcp'
          test -s "$ASSET"
          echo "$ASSET -> $(du -h "$ASSET" | cut -f1)"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "$ASSET" --clobber
