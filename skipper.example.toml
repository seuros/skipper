# Skipper Configuration
#
# Copy to `skipper.toml` in your repo root or `~/.config/skipper/config.toml` globally.
# Local config overrides global config.

# Remote host -> forge.
#
# This is what decides which tools skipper exposes. A forge's tools appear
# only when the workspace is a git repository whose remotes point at that
# forge (and its CLI is installed and authenticated) — having `gh` installed
# does not put GitHub tools in front of a Forgejo checkout.
#
# github.com, gitlab.com, and codeberg.org are recognized without config.
# Add self-hosted instances here; put them in the global config
# (~/.config/skipper/config.toml) so every repo on that host is covered.
#
# Forge names: github/gh, gitlab/glab, gitea/forgejo/tea.

# [hosts]
# "github.enterprise.com" = "github"
# "gitlab.internal" = "gitlab"
# "192.168.3.20" = "forgejo"
# "git.example.com" = "gitea"

# Turn a forge off: its tools stay hidden whatever the remotes say.
# Gitea and Forgejo are one forge to skipper; disabling either hides both.

# [providers.github]
# disabled = true

# [providers.gitlab]
# disabled = true

# [providers.forgejo]
# disabled = true

# Writes: pr_merge, git_push, git_pull, git_fetch.
#
# Off by default, and read from the global config (~/.config/skipper/config.toml)
# only: a repository's skipper.toml cannot turn them on. With confirm (the
# default) each merge and push is put to the user through the client (MCP
# elicitation); a client that cannot ask is refused. confirm = false lets
# writes run unattended.

# [writes]
# enabled = true
# confirm = true
