[package]
name = "skipper"
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih"]
description = "MCP server for git repositories: local git in-process via gitoxide; GitHub, Gitea and Forgejo over their APIs; GitLab through glab"
license = "BSD-2-Clause"
repository = "https://github.com/seuros/skipper"
keywords = ["mcp", "git", "github", "gitlab", "forgejo"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["**/tests.rs", "**/tests/"]
autobins = false

[[bin]]
name = "skipper-mcp"
path = "src/main.rs"

[workspace]

[dependencies]
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.1"
semver = "1"
thiserror = "2"
mcp-host = { version = "0.9.0", features = ["macros"] }
schemars = "1.2.2"
jiff = { version = "0.2", features = ["serde"] }
tracing = "0.1"
urlencoding = "2"
rama = { version = "0.4.0", default-features = false, features = ["std", "http", "tcp", "rustls", "ring", "tls", "http-backend", "dns"] }
serde_yaml_ng = "0.10"
similar = "3.2.0"
url = "2.5.8"
chrono-machines = { version = "0.8", features = ["async"] }
throttle-machines = "0.2"
tracing-subscriber = "0.3"
gix = { version = "=0.89.0", features = ["max-performance-safe", "blob-diff", "status", "revision", "blame", "command"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-test = "0.4"
tokio = { version = "1", features = ["test-util"] }

[features]
default = ["github", "gitlab", "tea"]
github = []
gitlab = []
tea = []

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
# A binary: a `pub` item nothing uses is dead code too.
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal API of one binary: typed errors say how a call fails, and
# `pub(crate)` inside private modules is the visibility the code means.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
# Nursery lints that make this code worse: `map_or_else` with two closures
# over a plain `if let`, and early drops that split short critical sections.
option_if_let_else = "allow"
significant_drop_tightening = "allow"
